<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>Which ads are selling pizza? — Bella Vita Pizza</title>
    <meta name="description" content="Which advertising is actually selling pizza for a six-shop chain? Display, online video and email compared on the cost of an incremental order." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Assets are content-hashed and old ones are eventually pruned, so a
      // browser holding a cached copy of this page after a deploy can request a
      // bundle that no longer exists — which renders a blank page. Catch the
      // failed script load and reload once past the HTTP cache.
      (function () {
        var KEY = "mh-stale-reload";
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT" && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, "1");
              location.replace(location.pathname + "?r=" + Date.now());
            }
          },
          true
        );
        window.addEventListener("load", function () {
          if (document.getElementById("root").childElementCount > 0) {
            sessionStorage.removeItem(KEY);
          }
        });
      })();
    </script>
    <script type="module" src="/src/madhive/main.tsx"></script>
  </body>
</html>
