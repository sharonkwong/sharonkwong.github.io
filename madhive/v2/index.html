    <link rel="modulepreload" crossorigin href="../../assets/text-CbBO4u8B.js">
    <link rel="modulepreload" crossorigin href="../../assets/AreaChart-YWtRgkFK.js">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Assets are content-hashed, so a browser holding a cached copy of this
      // page after a deploy can request a bundle that no longer exists — which
      // renders a blank page. Catch the failed load and reload once past cache.
      (function () {
        var KEY = "mhv2-stale-reload";
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT" && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, "1");
              location.replace(location.pathname + "?r=" + Date.now());
            }
          },
          true
        );
        window.addEventListener("load", function () {
          if (document.getElementById("root").childElementCount > 0) {
            sessionStorage.removeItem(KEY);
          }
        });
      })();
    </script>
  </body>
</html>
